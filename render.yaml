services:
  - type: web
    name: jessica-procurement-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir src app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: USE_MOCK_DATA
        value: true
      - key: SAP_BASE_URL
        sync: false
      - key: SAP_USER
        sync: false
      - key: SAP_PASSWORD
        sync: false
      - key: SAP_CLIENT
        value: "100"
      - key: DEFAULT_PURCHASING_ORG
        value: "1010"
      - key: WEIGHT_PRICE
        value: "0.35"
      - key: WEIGHT_DELIVERY
        value: "0.30"
      - key: WEIGHT_EVALUATION
        value: "0.35"
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-20251101
